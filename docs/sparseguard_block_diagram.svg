<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="890" viewBox="0 0 1250 890" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" refX="8" refY="3" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto"><path d="M0 0 0 6 9 3Z" fill="#33404D"/></marker>
    <marker id="as" refX="1" refY="3" markerWidth="10" markerHeight="10" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0 0 0 6 9 3Z" fill="#33404D"/></marker>
    <style>
      .b{stroke:#33404D;stroke-width:2;fill:#EEF2F5}
      .s{stroke:#2F5D8A;stroke-width:2;fill:#E8F0F8}
      .p{stroke:#7B4A9A;stroke-width:2;fill:#F3EAF7}
      .c{stroke:#B8860B;stroke-width:2;fill:#FDF6E3}
      .o{stroke:#2E7D32;stroke-width:2;fill:#EAF6EC}
      .t{font-size:15px;font-weight:700;fill:#111;text-anchor:middle}
      .d{font-size:11.5px;fill:#333;text-anchor:middle}
      .l{font-size:11px;fill:#444}
      .w{stroke:#33404D;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .k{stroke:#33404D;stroke-width:1.6;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
      .n{stroke:#33404D;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="1250" height="890" fill="#fff"/>

  <!-- host di luar chip -->
  <rect x="40" y="14" width="240" height="58" rx="8" class="b"/>
  <text x="160" y="38" class="t">host (di luar chip)</text>
  <text x="160" y="58" class="d">fitur, standardisasi, kuantisasi INT8</text>

  <!-- batas chip -->
  <rect x="20" y="100" width="1215" height="735" rx="10" fill="none" stroke="#9AA7B0" stroke-width="1.8" stroke-dasharray="8 5"/>

  <!-- host <-> spi -->
  <path d="M160 88V148" class="w" marker-start="url(#as)"/>
  <text x="170" y="94" class="l">SPI mode 0 (SCLK, CS_N, MOSI, MISO)</text>

  <!-- kolom A -->
  <rect x="40" y="150" width="240" height="90" rx="8" class="b"/>
  <text x="160" y="176" class="t">spi_slave</text>
  <text x="160" y="198" class="d">STREAM: blob 352 B → SHA, SRAM,</text>
  <text x="160" y="214" class="d">mask_gen, param_reg</text>
  <text x="160" y="230" class="d">INFER: 16 fitur → feature_buf</text>

  <rect x="40" y="290" width="240" height="80" rx="8" class="s"/>
  <text x="160" y="316" class="t">sha256_core</text>
  <text x="160" y="338" class="d">hash blob 352 B (6 blok 512 bit)</text>
  <text x="160" y="356" class="d">reuse TT07 0718 (belum diverifikasi)</text>

  <rect x="40" y="480" width="240" height="70" rx="8" class="s"/>
  <text x="160" y="506" class="t">bandingkan digest</text>
  <text x="160" y="528" class="d">cocok / tidak cocok</text>

  <rect x="40" y="620" width="240" height="160" rx="8" class="c"/>
  <text x="160" y="648" class="t">ctrl_fsm</text>
  <text x="160" y="672" class="d">IDLE→STREAM→VERIFY→INFER⇄OUT</text>
  <text x="160" y="690" class="d">+ERROR (keluar hanya lewat reset)</text>
  <text x="160" y="716" class="d">port tulis weight_sram dan</text>
  <text x="160" y="732" class="d">param_reg dikunci setelah VERIFY</text>
  <text x="160" y="758" class="d">sampai reset</text>

  <path d="M160 240V288" class="w"/>
  <path d="M160 370V478" class="w"/>
  <path d="M160 550V618" class="w"/>
  <text x="170" y="578" class="l">cocok: weights_valid</text>
  <text x="170" y="594" class="l">tidak: integrity_fail</text>

  <!-- bus blob STREAM -->
  <path d="M280 195H338" class="w"/>
  <path d="M310 195V415H338" class="w"/>
  <path d="M310 315H338" class="w"/>
  <text x="287" y="262" class="l" transform="rotate(-90 300 262)">blob (STREAM)</text>

  <!-- kolom B -->
  <rect x="340" y="150" width="240" height="90" rx="8" class="b"/>
  <text x="460" y="176" class="t">weight_sram (W1)</text>
  <text x="460" y="198" class="d">byte 0–255, urutan hidden-major</text>
  <text x="460" y="214" class="d">16 kata × 128 bit</text>
  <text x="460" y="230" class="d">(1 kata = 16 bobot 1 neuron)</text>

  <rect x="340" y="280" width="240" height="70" rx="8" class="p"/>
  <text x="460" y="306" class="t">mask_gen</text>
  <text x="460" y="328" class="d">mask[j][i] = (W1[j][i] ≠ 0), 16×16 bit</text>

  <rect x="340" y="380" width="240" height="70" rx="8" class="b"/>
  <text x="460" y="406" class="t">param_reg</text>
  <text x="460" y="428" class="d">byte 256–351: b1, W2, b2, M, shift, thr</text>

  <rect x="340" y="480" width="240" height="70" rx="8" class="s"/>
  <text x="460" y="506" class="t">referensi_digest (ROM)</text>
  <text x="460" y="528" class="d">256 bit, konstanta saat sintesis</text>
  <path d="M340 515H282" class="w"/>

  <!-- jalur fitur (INFER) -->
  <path d="M250 150V120H1100V148" class="w"/>
  <text x="560" y="113" class="l">fitur 16×INT8 (fase INFER, setelah weights_valid)</text>

  <!-- W1 baris ke mac -->
  <path d="M580 195H610V260H1000V298" class="w"/>
  <text x="650" y="253" class="l">W1[j]: 1 kata 128 bit per neuron</text>

  <!-- mask ke sched -->
  <path d="M580 315H638" class="w"/>
  <text x="586" y="308" class="l">mask[j]</text>

  <!-- kolom C: penjadwal -->
  <rect x="640" y="290" width="240" height="100" rx="8" class="p"/>
  <text x="760" y="316" class="t">sparse_sched</text>
  <text x="760" y="338" class="d">priority encoder: hingga 4 indeks</text>
  <text x="760" y="354" class="d">nonzero terendah per siklus</text>
  <text x="760" y="370" class="d">neuron mask = 0 dilewati (0 siklus)</text>
  <path d="M880 330H938" class="w"/>
  <text x="886" y="322" class="l">idx×4</text><text x="890" y="346" class="l">valid</text>

  <!-- kolom D: datapath -->
  <rect x="940" y="150" width="240" height="70" rx="8" class="b"/>
  <text x="1060" y="176" class="t">feature_buf</text>
  <text x="1060" y="198" class="d">16×INT8 (x0…x15)</text>
  <path d="M1100 220V298" class="w"/>
  <text x="1108" y="270" class="l">x[i]</text>

  <rect x="940" y="300" width="240" height="90" rx="8" class="p"/>
  <text x="1060" y="326" class="t">mac_array 4×1</text>
  <text x="1060" y="348" class="d">4 × (INT8·INT8) + adder tree</text>
  <text x="1060" y="364" class="d">akumulator INT32</text>
  <text x="1060" y="380" class="d">lane idle: operand ditahan</text>

  <rect x="990" y="430" width="190" height="70" rx="8" class="b"/>
  <text x="1085" y="456" class="t">relu_quant (layer 1)</text>
  <text x="1085" y="478" class="d">min((h·M + 2^(s−1)) » s, 127)</text>
  <path d="M1085 390V428" class="w"/>
  <text x="1092" y="416" class="l">acc1[j]</text>

  <rect x="990" y="540" width="190" height="60" rx="8" class="b"/>
  <text x="1085" y="564" class="t">hidden_buf</text>
  <text x="1085" y="586" class="d">16×INT8 (hq)</text>
  <path d="M1085 500V538" class="w"/>

  <!-- umpan balik layer 2 -->
  <path d="M1180 570H1212V345H1182" class="w"/>
  <text x="1222" y="470" class="l" transform="rotate(90 1222 470)" text-anchor="middle">hq → layer 2</text>

  <!-- bypass acc2 -->
  <path d="M960 390V648" class="w"/>
  <text x="966" y="636" class="l">acc2</text>

  <rect x="940" y="650" width="240" height="70" rx="8" class="o"/>
  <text x="1060" y="676" class="t">output_cmp</text>
  <text x="1060" y="698" class="d">alarm = (acc2 ≥ thr)</text>

  <!-- parameter -->
  <path d="M580 415H910V685H938" class="w"/>
  <path d="M910 415V375H938" class="w"/>
  <path d="M910 465H952A8 8 0 0 1 968 465H988" class="w"/>
  <text x="592" y="434" class="l">b1, W2, b2 → mac_array</text><text x="592" y="449" class="l">M, shift → relu_quant</text><text x="592" y="464" class="l">thr → output_cmp</text>

  <!-- kontrol -->
  <path d="M280 680H760V423A8 8 0 0 1 760 407V392" class="k"/>
  <text x="300" y="672" class="l">start, weights_valid (izin baca)</text>
  <path d="M280 750H1060V722" class="k"/>
  <text x="300" y="742" class="l">integrity_fail → inferensi ditolak</text>

  <!-- pin keluaran -->
  <path d="M1120 720V872" class="w"/>
  <text x="1128" y="862" class="l">alarm, result_valid</text>
  <path d="M260 780V872" class="w"/>
  <text x="268" y="862" class="l">integrity_ok, integrity_fail</text>

  <!-- legenda -->
  <text x="40" y="820" font-size="14" font-weight="700" fill="#111">SparseGuard (top module)</text>
  <text x="290" y="820" class="l">Putus-putus: kontrol.  Biru: jalur integritas.  Ungu: jalur sparsity.  Hijau: keluaran.  Skor acc2 dapat dibaca host lewat MISO.</text>
</svg>
